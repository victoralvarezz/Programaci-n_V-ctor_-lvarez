<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1200" viewBox="0 0 1800 1200">
  <rect width="1800" height="1200" fill="#1a1a1a"/>

  <defs>
    <marker id="inherit" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto">
      <path d="M1 1 L11 6 L1 11 Z" fill="#1a1a1a" stroke="white" stroke-width="1.2"/>
    </marker>
    <marker id="assoc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M1 1 L9 5 L1 9" fill="none" stroke="white" stroke-width="1.5"/>
    </marker>
  </defs>

  <style>
    .t { font-family: Arial, sans-serif; font-size: 13px; font-weight: bold; fill: white; }
    .s { font-family: Arial, sans-serif; font-size: 11px; fill: #dddddd; }
  </style>

  <!-- ═══════════════════════════════════════════
       ARMAS (abstracta) — arriba centro
  ══════════════════════════════════════════════ -->
  <rect x="720" y="30" width="220" height="105" fill="#1a1a1a" stroke="white" stroke-width="1.5"/>
  <rect x="720" y="30" width="220" height="28" fill="#2d2d2d" stroke="white" stroke-width="1.5"/>
  <text x="830" y="50" text-anchor="middle" class="t">Armas</text>
  <line x1="720" y1="58" x2="940" y2="58" stroke="white" stroke-width="0.8"/>
  <text x="728" y="74" class="s">- nombre: String</text>
  <text x="728" y="90" class="s">- danioBase: int</text>
  <line x1="720" y1="98" x2="940" y2="98" stroke="white" stroke-width="0.8"/>
  <text x="728" y="113" class="s">+ calcularDanio(atacante, defensor): int</text>

  <!-- SableLuz -->
  <rect x="430" y="210" width="220" height="105" fill="#1a1a1a" stroke="white" stroke-width="1.5"/>
  <rect x="430" y="210" width="220" height="28" fill="#2d2d2d" stroke="white" stroke-width="1.5"/>
  <text x="540" y="230" text-anchor="middle" class="t">SableLuz</text>
  <line x1="430" y1="238" x2="650" y2="238" stroke="white" stroke-width="0.8"/>
  <text x="438" y="254" class="s">- nombre: "Sable de Luz"</text>
  <text x="438" y="270" class="s">- danioBase: 10</text>
  <line x1="430" y1="278" x2="650" y2="278" stroke="white" stroke-width="0.8"/>
  <text x="438" y="294" class="s">+ calcularDanio(): danioBase + ataque</text>

  <!-- Blaster -->
  <rect x="1020" y="210" width="220" height="105" fill="#1a1a1a" stroke="white" stroke-width="1.5"/>
  <rect x="1020" y="210" width="220" height="28" fill="#2d2d2d" stroke="white" stroke-width="1.5"/>
  <text x="1130" y="230" text-anchor="middle" class="t">Blaster</text>
  <line x1="1020" y1="238" x2="1240" y2="238" stroke="white" stroke-width="0.8"/>
  <text x="1028" y="254" class="s">- nombre: "Blaster"</text>
  <text x="1028" y="270" class="s">- danioBase: 8</text>
  <line x1="1020" y1="278" x2="1240" y2="278" stroke="white" stroke-width="0.8"/>
  <text x="1028" y="294" class="s">+ calcularDanio(): danioBase + ataque/2</text>

  <!-- herencia SableLuz -> Armas -->
  <line x1="540" y1="210" x2="780" y2="135" stroke="white" stroke-width="1.2" marker-end="url(#inherit)"/>
  <!-- herencia Blaster -> Armas -->
  <line x1="1130" y1="210" x2="880" y2="135" stroke="white" stroke-width="1.2" marker-end="url(#inherit)"/>

  <!-- ═══════════════════════════════════════════
       hechizos (abstracta)
  ══════════════════════════════════════════════ -->
  <rect x="130" y="210" width="240" height="110" fill="#1a1a1a" stroke="white" stroke-width="1.5"/>
  <rect x="130" y="210" width="240" height="28" fill="#2d2d2d" stroke="white" stroke-width="1.5"/>
  <text x="250" y="230" text-anchor="middle" class="t">hechizos</text>
  <line x1="130" y1="238" x2="370" y2="238" stroke="white" stroke-width="0.8"/>
  <text x="138" y="254" class="s">- nombre: String</text>
  <text x="138" y="270" class="s">- costeMana: int</text>
  <line x1="130" y1="278" x2="370" y2="278" stroke="white" stroke-width="0.8"/>
  <text x="138" y="294" class="s">+ lanzar(lanzador, objetivos[])</text>
  <text x="138" y="308" class="s">  [abstracto]</text>

  <!-- Subclases hechizos — 3 SECCIONES -->
  <rect x="20" y="390" width="240" height="230" fill="#1a1a1a" stroke="white" stroke-width="1.5"/>
  <!-- cabecera -->
  <rect x="20" y="390" width="240" height="28" fill="#2d2d2d" stroke="white" stroke-width="1.5"/>
  <text x="140" y="410" text-anchor="middle" class="t">Subclases hechizos</text>
  <!-- seccion campos: nombres -->
  <line x1="20" y1="418" x2="260" y2="418" stroke="white" stroke-width="0.8"/>
  <text x="28" y="435" class="s">EmpujonFuerza</text>
  <text x="28" y="451" class="s">Telequinesis</text>
  <text x="28" y="467" class="s">Estrangulamiento</text>
  <text x="28" y="483" class="s">Aplastamiento</text>
  <text x="28" y="499" class="s">Curacion</text>
  <text x="28" y="515" class="s">LanzarQuemadura</text>
  <text x="28" y="531" class="s">LanzarRenovar</text>
  <text x="28" y="547" class="s">LanzarVeneno</text>
  <!-- seccion metodos -->
  <line x1="20" y1="555" x2="260" y2="555" stroke="white" stroke-width="0.8"/>
  <text x="28" y="572" class="s">+ lanzar(lanzador, objetivos[])</text>
  <text x="28" y="588" class="s">+ [heredado de hechizos]</text>

  <!-- herencia subclases -> hechizos -->
  <line x1="210" y1="390" x2="220" y2="320" stroke="white" stroke-width="1.2" marker-end="url(#inherit)"/>

  <!-- ═══════════════════════════════════════════
       PERSONAJE (abstracta) — centro
  ══════════════════════════════════════════════ -->
  <rect x="670" y="420" width="330" height="295" fill="#1a1a1a" stroke="white" stroke-width="2"/>
  <rect x="670" y="420" width="330" height="28" fill="#2d2d2d" stroke="white" stroke-width="2"/>
  <text x="835" y="440" text-anchor="middle" class="t">Personaje</text>
  <line x1="670" y1="448" x2="1000" y2="448" stroke="white" stroke-width="0.8"/>
  <text x="678" y="465" class="s">- nombre: String</text>
  <text x="678" y="481" class="s">- vida / vidaMax: int</text>
  <text x="678" y="497" class="s">- ataque / defensa: int</text>
  <text x="678" y="513" class="s">- mana / manaMax: int</text>
  <text x="678" y="529" class="s">- arma: Armas</text>
  <text x="678" y="545" class="s">- estados: Estado[5]</text>
  <text x="678" y="561" class="s">- numEstados: int</text>
  <line x1="670" y1="570" x2="1000" y2="570" stroke="white" stroke-width="0.8"/>
  <text x="678" y="587" class="s">+ estaVivo(): boolean</text>
  <text x="678" y="603" class="s">+ recibirDanio(int)</text>
  <text x="678" y="619" class="s">+ aplicarEstado(Estado)</text>
  <text x="678" y="635" class="s">+ procesarEstados()</text>
  <text x="678" y="651" class="s">+ regenerarMana()</text>
  <text x="678" y="667" class="s">+ hacerTurno() [abstracto]</text>
  <text x="678" y="683" class="s">+ ataqueBasico / usarHechizo...</text>
  <text x="678" y="699" class="s">+ enemigoRandom()</text>

  <!-- Armas -> Personaje -->
  <line x1="830" y1="135" x2="830" y2="420" stroke="white" stroke-width="1.2" stroke-dasharray="6,3" marker-end="url(#assoc)"/>
  <!-- hechizos -> Personaje -->
  <line x1="370" y1="265" x2="670" y2="530" stroke="white" stroke-width="1.2" stroke-dasharray="6,3" marker-end="url(#assoc)"/>

  <!-- ═══════════════════════════════════════════
       SUBCLASES PERSONAJE — izquierda
  ══════════════════════════════════════════════ -->

  <!-- Jedi -->
  <rect x="290" y="420" width="210" height="125" fill="#1a1a1a" stroke="white" stroke-width="1.5"/>
  <rect x="290" y="420" width="210" height="28" fill="#2d2d2d" stroke="white" stroke-width="1.5"/>
  <text x="395" y="440" text-anchor="middle" class="t">Jedi</text>
  <line x1="290" y1="448" x2="500" y2="448" stroke="white" stroke-width="0.8"/>
  <text x="298" y="464" class="s">vida:130  ataque:24</text>
  <text x="298" y="480" class="s">defensa:8  mana:20</text>
  <text x="298" y="496" class="s">arma: SableLuz</text>
  <line x1="290" y1="504" x2="500" y2="504" stroke="white" stroke-width="0.8"/>
  <text x="298" y="520" class="s">+ hacerTurno()</text>
  <text x="298" y="536" class="s">Empujon/Aplast./Telekin.</text>
  <line x1="500" y1="483" x2="670" y2="503" stroke="white" stroke-width="1.2" marker-end="url(#inherit)"/>

  <!-- Sith -->
  <rect x="290" y="585" width="210" height="125" fill="#1a1a1a" stroke="white" stroke-width="1.5"/>
  <rect x="290" y="585" width="210" height="28" fill="#2d2d2d" stroke="white" stroke-width="1.5"/>
  <text x="395" y="605" text-anchor="middle" class="t">Sith</text>
  <line x1="290" y1="613" x2="500" y2="613" stroke="white" stroke-width="0.8"/>
  <text x="298" y="629" class="s">vida:130  ataque:26</text>
  <text x="298" y="645" class="s">defensa:7  mana:25</text>
  <text x="298" y="661" class="s">arma: SableLuz</text>
  <line x1="290" y1="669" x2="500" y2="669" stroke="white" stroke-width="0.8"/>
  <text x="298" y="685" class="s">+ hacerTurno()</text>
  <text x="298" y="701" class="s">Empujon/Aplast./Estrang.</text>
  <line x1="500" y1="648" x2="670" y2="580" stroke="white" stroke-width="1.2" marker-end="url(#inherit)"/>

  <!-- Sanador -->
  <rect x="290" y="750" width="210" height="125" fill="#1a1a1a" stroke="white" stroke-width="1.5"/>
  <rect x="290" y="750" width="210" height="28" fill="#2d2d2d" stroke="white" stroke-width="1.5"/>
  <text x="395" y="770" text-anchor="middle" class="t">Sanador</text>
  <line x1="290" y1="778" x2="500" y2="778" stroke="white" stroke-width="0.8"/>
  <text x="298" y="794" class="s">vida:100  ataque:10</text>
  <text x="298" y="810" class="s">defensa:4  mana:35</text>
  <text x="298" y="826" class="s">arma: Blaster</text>
  <line x1="290" y1="834" x2="500" y2="834" stroke="white" stroke-width="0.8"/>
  <text x="298" y="850" class="s">+ hacerTurno()</text>
  <text x="298" y="866" class="s">Curacion / Renovar</text>
  <line x1="500" y1="813" x2="670" y2="670" stroke="white" stroke-width="1.2" marker-end="url(#inherit)"/>

  <!-- ═══════════════════════════════════════════
       SUBCLASES PERSONAJE — derecha
  ══════════════════════════════════════════════ -->

  <!-- SoldadoRebelde -->
  <rect x="1170" y="420" width="210" height="125" fill="#1a1a1a" stroke="white" stroke-width="1.5"/>
  <rect x="1170" y="420" width="210" height="28" fill="#2d2d2d" stroke="white" stroke-width="1.5"/>
  <text x="1275" y="440" text-anchor="middle" class="t">SoldadoRebelde</text>
  <line x1="1170" y1="448" x2="1380" y2="448" stroke="white" stroke-width="0.8"/>
  <text x="1178" y="464" class="s">vida:110  ataque:22</text>
  <text x="1178" y="480" class="s">defensa:4  mana:20</text>
  <text x="1178" y="496" class="s">arma: Blaster</text>
  <line x1="1170" y1="504" x2="1380" y2="504" stroke="white" stroke-width="0.8"/>
  <text x="1178" y="520" class="s">+ hacerTurno()</text>
  <text x="1178" y="536" class="s">Veneno / ataque basico</text>
  <line x1="1170" y1="483" x2="1000" y2="503" stroke="white" stroke-width="1.2" marker-end="url(#inherit)"/>

  <!-- SoldadoImperial -->
  <rect x="1170" y="585" width="210" height="125" fill="#1a1a1a" stroke="white" stroke-width="1.5"/>
  <rect x="1170" y="585" width="210" height="28" fill="#2d2d2d" stroke="white" stroke-width="1.5"/>
  <text x="1275" y="605" text-anchor="middle" class="t">SoldadoImperial</text>
  <line x1="1170" y1="613" x2="1380" y2="613" stroke="white" stroke-width="0.8"/>
  <text x="1178" y="629" class="s">vida:110  ataque:21</text>
  <text x="1178" y="645" class="s">defensa:5  mana:20</text>
  <text x="1178" y="661" class="s">arma: Blaster</text>
  <line x1="1170" y1="669" x2="1380" y2="669" stroke="white" stroke-width="0.8"/>
  <text x="1178" y="685" class="s">+ hacerTurno()</text>
  <text x="1178" y="701" class="s">Veneno / ataque basico</text>
  <line x1="1170" y1="648" x2="1000" y2="580" stroke="white" stroke-width="1.2" marker-end="url(#inherit)"/>

  <!-- Cazarrecompensas -->
  <rect x="1170" y="750" width="210" height="125" fill="#1a1a1a" stroke="white" stroke-width="1.5"/>
  <rect x="1170" y="750" width="210" height="28" fill="#2d2d2d" stroke="white" stroke-width="1.5"/>
  <text x="1275" y="770" text-anchor="middle" class="t">Cazarrecompensas</text>
  <line x1="1170" y1="778" x2="1380" y2="778" stroke="white" stroke-width="0.8"/>
  <text x="1178" y="794" class="s">vida:105  ataque:21</text>
  <text x="1178" y="810" class="s">defensa:4  mana:30</text>
  <text x="1178" y="826" class="s">arma: Blaster</text>
  <line x1="1170" y1="834" x2="1380" y2="834" stroke="white" stroke-width="0.8"/>
  <text x="1178" y="850" class="s">+ hacerTurno()</text>
  <text x="1178" y="866" class="s">Quemadura / ataque basico</text>
  <line x1="1170" y1="813" x2="1000" y2="670" stroke="white" stroke-width="1.2" marker-end="url(#inherit)"/>

  <!-- ═══════════════════════════════════════════
       MAIN — arriba derecha
  ══════════════════════════════════════════════ -->
  <rect x="1420" y="180" width="340" height="240" fill="#1a1a1a" stroke="white" stroke-width="1.5"/>
  <rect x="1420" y="180" width="340" height="28" fill="#2d2d2d" stroke="white" stroke-width="1.5"/>
  <text x="1590" y="200" text-anchor="middle" class="t">main</text>
  <line x1="1420" y1="208" x2="1760" y2="208" stroke="white" stroke-width="0.8"/>
  <text x="1428" y="224" class="s">- sc: Scanner</text>
  <text x="1428" y="240" class="s">- menuPersonajes: Map&lt;Integer,String&gt;</text>
  <text x="1428" y="256" class="s">- equipoA / equipoB: Personaje[]</text>
  <line x1="1420" y1="264" x2="1760" y2="264" stroke="white" stroke-width="0.8"/>
  <text x="1428" y="280" class="s">+ main(args[])</text>
  <text x="1428" y="296" class="s">+ turnoJugador()</text>
  <text x="1428" y="312" class="s">+ elegirObjetivo(): Personaje</text>
  <text x="1428" y="328" class="s">+ elegirEquipo(): Personaje[]</text>
  <text x="1428" y="344" class="s">+ hayVivos(Personaje[]): boolean</text>
  <text x="1428" y="360" class="s">+ procesarEquipo(Personaje[])</text>
  <text x="1428" y="376" class="s">+ sleep(int)</text>
  <text x="1428" y="392" class="s">+ leerEntero(int, int): int</text>

  <!-- main -> Personaje -->
  <line x1="1420" y1="340" x2="1000" y2="560" stroke="white" stroke-width="1.2" stroke-dasharray="6,3" marker-end="url(#assoc)"/>

  <!-- ═══════════════════════════════════════════
       ESTADO (abstracta) — abajo centro
  ══════════════════════════════════════════════ -->
  <rect x="670" y="810" width="330" height="125" fill="#1a1a1a" stroke="white" stroke-width="1.5"/>
  <rect x="670" y="810" width="330" height="28" fill="#2d2d2d" stroke="white" stroke-width="1.5"/>
  <text x="835" y="830" text-anchor="middle" class="t">Estado</text>
  <line x1="670" y1="838" x2="1000" y2="838" stroke="white" stroke-width="0.8"/>
  <text x="678" y="854" class="s">- nombre: String</text>
  <text x="678" y="870" class="s">- turnosRestantes: int</text>
  <text x="678" y="886" class="s">- potenciaPorTurno: int</text>
  <line x1="670" y1="894" x2="1000" y2="894" stroke="white" stroke-width="0.8"/>
  <text x="678" y="910" class="s">+ aplicarEfecto(Personaje) [abstracto]</text>
  <text x="678" y="926" class="s">  turnosRestantes--</text>

  <!-- Personaje -> Estado -->
  <line x1="835" y1="715" x2="835" y2="810" stroke="white" stroke-width="1.2" stroke-dasharray="6,3" marker-end="url(#assoc)"/>

  <!-- ═══════════════════════════════════════════
       SUBCLASES ESTADO — bien separadas abajo
  ══════════════════════════════════════════════ -->

  <!-- Quemaduras -->
  <rect x="280" y="1000" width="230" height="140" fill="#1a1a1a" stroke="white" stroke-width="1.5"/>
  <rect x="280" y="1000" width="230" height="28" fill="#2d2d2d" stroke="white" stroke-width="1.5"/>
  <text x="395" y="1020" text-anchor="middle" class="t">Quemaduras</text>
  <line x1="280" y1="1028" x2="510" y2="1028" stroke="white" stroke-width="0.8"/>
  <text x="288" y="1044" class="s">- potenciaPorTurno: 5</text>
  <text x="288" y="1060" class="s">- turnosRestantes: 3</text>
  <text x="288" y="1076" class="s">- tipo: DoT (fuego)</text>
  <line x1="280" y1="1084" x2="510" y2="1084" stroke="white" stroke-width="0.8"/>
  <text x="288" y="1100" class="s">+ aplicarEfecto()</text>
  <text x="288" y="1116" class="s">  vida -= potenciaPorTurno</text>
  <line x1="395" y1="1000" x2="730" y2="935" stroke="white" stroke-width="1.2" marker-end="url(#inherit)"/>

  <!-- Veneno -->
  <rect x="720" y="1000" width="230" height="140" fill="#1a1a1a" stroke="white" stroke-width="1.5"/>
  <rect x="720" y="1000" width="230" height="28" fill="#2d2d2d" stroke="white" stroke-width="1.5"/>
  <text x="835" y="1020" text-anchor="middle" class="t">Veneno</text>
  <line x1="720" y1="1028" x2="950" y2="1028" stroke="white" stroke-width="0.8"/>
  <text x="728" y="1044" class="s">- potenciaPorTurno: 4</text>
  <text x="728" y="1060" class="s">- turnosRestantes: 3</text>
  <text x="728" y="1076" class="s">- tipo: DoT (veneno)</text>
  <line x1="720" y1="1084" x2="950" y2="1084" stroke="white" stroke-width="0.8"/>
  <text x="728" y="1100" class="s">+ aplicarEfecto()</text>
  <text x="728" y="1116" class="s">  vida -= potenciaPorTurno</text>
  <line x1="835" y1="1000" x2="835" y2="935" stroke="white" stroke-width="1.2" marker-end="url(#inherit)"/>

  <!-- Senadora (Renovar) -->
  <rect x="1160" y="1000" width="230" height="140" fill="#1a1a1a" stroke="white" stroke-width="1.5"/>
  <rect x="1160" y="1000" width="230" height="28" fill="#2d2d2d" stroke="white" stroke-width="1.5"/>
  <text x="1275" y="1020" text-anchor="middle" class="t">Senadora (Renovar)</text>
  <line x1="1160" y1="1028" x2="1390" y2="1028" stroke="white" stroke-width="0.8"/>
  <text x="1168" y="1044" class="s">- potenciaPorTurno: 10</text>
  <text x="1168" y="1060" class="s">- turnosRestantes: 2</text>
  <text x="1168" y="1076" class="s">- tipo: HoT (cura)</text>
  <line x1="1160" y1="1084" x2="1390" y2="1084" stroke="white" stroke-width="0.8"/>
  <text x="1168" y="1100" class="s">+ aplicarEfecto()</text>
  <text x="1168" y="1116" class="s">  vida += potenciaPorTurno</text>
  <line x1="1275" y1="1000" x2="940" y2="935" stroke="white" stroke-width="1.2" marker-end="url(#inherit)"/>

</svg>
